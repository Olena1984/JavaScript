<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/style/style.css">
        <title>Задача 2</title>
    </head>
    <body>
        <h1>Задача 2. 
        </h1>
        <p>Дано рік народження (дата: 1 січня) та поточний рік. Знайти кількість років.</p>

        <script>
             // запитуємо числа
            const userAge = parseInt(prompt(`Введіть свій рік народження `, '0'));
            const currentYear = 2026;
            
            // отримання результату
            const result = currentYear - userAge;

            document.write(`<p> Вік користувача - ${result} років. </p>`);
        </script>    
    </body>
</html>
