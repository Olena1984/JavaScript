<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Задача 7</title>
    </head>
    <body>
        <h1>Задача 7
        </h1>
        <p>Знайти суму випадкового номера місяця (від 1 до 12) та випадкового
            номера дня (від 0 до 6).

        </p>

        <script>
             const randomNumberMonth = Math.floor(Math.random() * 12) + 1;
             const randomNumberDay = Math.floor(Math.random() * 7);
             
            // отримання результату
            const sumRandomNumber = randomNumberMonth + randomNumberDay;

            document.write(`<p> Сума випадкового номера: ${sumRandomNumber} </p>`);
        </script>
    </body>
</html>
