        <!-- <p>Дано масив елементів. Усі елементи, які більші за перший елемент
            помножити на 2
        </p> -->

        <script>
            // створення масиву чисел

            function createArrNumbers(numbers) {
                let newArray = []
                for (let i = 0; i <numbers; i++) {
                    const randNum = Math.floor(Math.random()*100)
                    newArray.push(randNum) 
                }
                return newArray  
            }
            const resArray = createArrNumbers(10)
            // document.write(`Масив чисел:${resArray}`)
            console.log(resArray);
            

            // forEach
            const firstEl = resArray[0]
            resArray.forEach((element, index, arr) => {
                if (element > firstEl) {
                    arr[index]*=2
                }
            });
            document.write(` ${resArray}`)
