    <body>
        <!-- <p>Дано масив цін. Змінити цей масив так, що на ціни товарів,
        які більші за 1000 грн. дати 30% знижки.</p> -->

        <script>
            let priceArr = Array.from({length:15}, ()=> Math.floor(Math.random()*2000))
            console.log(priceArr);
            const discount = 0.3
            const comparePrice = 1000
        // метод forEach
            priceArr.forEach((price, ind, arr) => {
                if (price>comparePrice) {
                    arr[ind]=parseFloat((price*(1-discount)).toFixed(2)) 
                }
            })
            console.log(priceArr);
            document.write(`Оновлені ціни із знижкою: ${priceArr}`)
